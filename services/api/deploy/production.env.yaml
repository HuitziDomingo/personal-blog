# Variables de entorno NO secretas de la API en Cloud Run (ADR-025, puntos 10 y
# 11). El workflow deploy-api.yml las aplica con --env-vars-file, que reemplaza
# todas las variables del servicio: lo que no esté aquí desaparece en el
# siguiente despliegue. GEMINI_MODEL lo agrega el workflow desde la variable de
# GitHub GEMINI_MODEL.
#
# Los secretos (JWT_SECRET, MONGO_URI, GEMINI_API_KEY) NO van aquí: el workflow
# los monta desde Secret Manager con --set-secrets.
#
# PORT no se define: Cloud Run lo pone y la API lo lee.

GIN_MODE: "release"
LOG_FORMAT: "json"

MONGO_DB_NAME: "personal_blog"

ALLOWED_ORIGINS: "https://huitzi.xyz,https://admin.huitzi.xyz"
MAX_BODY_BYTES: "1048576"

# Vacía hasta verificar en el primer despliegue cómo entrega Cloud Run la IP del
# cliente (ADR-025 punto 11, BLOG-041). Ver docs/runbooks/despliegue.md, paso 18.
TRUSTED_PROXIES: ""

# Asistente de escritura encendido al lanzar (ADR-025, punto 10).
ASSISTANT_ENABLED: "true"
ASSISTANT_TIMEOUT_SECONDS: "30"
ASSISTANT_THINKING_LEVEL: "low"
ASSISTANT_MAX_OUTPUT_TOKENS: "16384"

# Apagados al lanzar hasta pasar sus pruebas con modelos reales (ADR-025, punto
# 10). Se encienden cambiando este archivo, sin código nuevo.
COMMENTS_ENABLED: "false"
COMMENTS_MODERATION_ENABLED: "false"
