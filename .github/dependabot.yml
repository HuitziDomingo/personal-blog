version: 2

# ADR-013: cooldown de 7 días en las version updates. Las security updates no
# esperan el cooldown.
#
# Los grupos solo juntan minor y patch: cada major llega en su propio PR, que
# es [ALTO] y no se mergea sin revisión de León (CLAUDE.md). La excepción es
# @ng-icons/*, que sube junto también en los majors.

updates:
  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # @types/node sigue al runtime (Node 24, .nvmrc); un major nuevo llega
      # cuando cambie el runtime, en su propio PR.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript 7 no tiene soporte oficial de Angular 22; se revisa cuando
      # Angular lo anuncie.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore(deps)
    groups:
      # core y lucide suben juntos, también en los majors: lucide declara como
      # peer la misma versión de core. Va antes de minor-and-patch porque
      # Dependabot asigna cada dependencia al primer grupo que coincide.
      ng-icons:
        patterns:
          - "@ng-icons/*"
        update-types:
          - major
          - minor
          - patch
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # github-actions y docker solo admiten default-days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # github-actions y docker solo admiten default-days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
