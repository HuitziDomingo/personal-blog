name: backup-mongo

# Respaldo semanal de MongoDB Atlas M0 a Cloud Storage (ADR-025, punto 5). M0 no
# hace respaldos propios.
#
# La URI de Mongo NO está en GitHub: se lee de Secret Manager al ejecutarse, con
# Workload Identity Federation, y se enmascara antes de usarla. La cuenta de
# servicio de respaldo solo puede leer ese secreto y crear objetos en el bucket
# de respaldos (no leerlos ni borrarlos). La regla de borrado a los 90 días es
# del bucket (docs/runbooks/despliegue.md).
#
# El environment "backup" no pide aprobación: existe para que el token de OIDC
# lleve un subject propio (repo:…:environment:backup) y solo este workflow pueda
# hacerse pasar por la cuenta de respaldo.
#
# Variables de GitHub: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_BACKUP_SA,
# GCP_BACKUP_BUCKET.

on:
  schedule:
    # Domingos a las 09:00 UTC (03:00 en la Ciudad de México).
    - cron: "0 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-mongo
  cancel-in-progress: false

env:
  # mongodb-database-tools fijado por versión y sha256 (ADR-013: publicado el
  # 2026-11-02).
  TOOLS_VERSION: "100.20.1"
  TOOLS_SHA256: "96a9c32b5ea4492a2533151f420e41d5b762559951a1ec916eb3a72886734021"

jobs:
  backup:
    name: backup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: backup
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Install mongodb-database-tools
        run: |
          deb="mongodb-database-tools-ubuntu2404-x86_64-${TOOLS_VERSION}.deb"
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/$deb" "https://fastdl.mongodb.org/tools/db/$deb"
          echo "${TOOLS_SHA256}  $RUNNER_TEMP/$deb" | sha256sum --check --strict
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/$deb"
          mongodump --version

      # La URI va a un archivo de configuración de mongodump (--config), no a la
      # línea de comandos: así no aparece en la lista de procesos ni en el log.
      - name: Dump and upload
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          BUCKET: ${{ vars.GCP_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          uri=$(gcloud secrets versions access latest --secret=mongo-uri --project "$PROJECT")
          echo "::add-mask::$uri"
          printf 'uri: "%s"\n' "$uri" > "$RUNNER_TEMP/mongodump.yaml"
          unset uri
          name="mongo-$(date -u +%Y%m%dT%H%M%SZ).archive.gz"
          mongodump --config "$RUNNER_TEMP/mongodump.yaml" --archive="$RUNNER_TEMP/$name" --gzip
          rm -f "$RUNNER_TEMP/mongodump.yaml"
          gcloud storage cp "$RUNNER_TEMP/$name" "gs://$BUCKET/$name" --project "$PROJECT"
          ls -l "$RUNNER_TEMP/$name"
          rm -f "$RUNNER_TEMP/$name"
