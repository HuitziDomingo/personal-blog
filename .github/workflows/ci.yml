name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v7

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            api:
              - "services/api/**"
              - "docs/api/**"
              - "packages/api-types/**"
              - "pnpm-lock.yaml"
              - ".github/workflows/ci.yml"

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    # MongoDB 8.x no arranca en kernels 6.19 a 7.0.13 (SERVER-121912). Volver a
    # ubuntu-latest cuando ese runner use un kernel 7.0.14 o posterior (BLOG-033).
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: check generated code
        working-directory: .
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          make generate
          git diff --exit-code

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          working-directory: services/api

      - name: go test
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017
        run: go test -race -cover ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: docker build
        run: docker build -t personal-blog-api .

  ci:
    name: ci
    needs: [changes, api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
