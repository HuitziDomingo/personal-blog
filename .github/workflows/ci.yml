name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            api:
              - "services/api/**"
              - "docs/api/**"
              - "packages/api-types/**"
              - "pnpm-lock.yaml"
              - "Makefile"
              - "scripts/**"
              - ".github/workflows/ci.yml"
            admin:
              - "apps/admin/**"
              - "packages/api-types/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".nvmrc"
              - ".github/workflows/ci.yml"

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    # MongoDB 8.x no arranca en kernels 6.19 a 7.0.13 (SERVER-121912). Volver a
    # ubuntu-latest cuando ese runner use un kernel 7.0.14 o posterior (BLOG-033).
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: check generated code
        working-directory: .
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          make generate
          # porcelain también ve archivos nuevos sin rastrear, como una
          # petición nueva de Bruno en docs/api/bruno/generated/.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "El código generado no coincide con docs/api/openapi.yaml: corre make generate."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          working-directory: services/api

      - name: go test
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017
        run: go test -race -cover ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: docker build
        run: docker build -t personal-blog-api .

  admin:
    name: admin
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # pnpm directo y no make: el filtro del job admin no incluye el Makefile
      # (ADR-014).
      - name: lint
        run: pnpm --filter @personal-blog/admin lint

      - name: test
        run: pnpm --filter @personal-blog/admin test

      # La configuración production falla si se superan los budgets de angular.json.
      - name: build
        run: pnpm --filter @personal-blog/admin build

      # Prueba la CSP del build anterior en el Chrome que traen los runners de
      # Ubuntu: falla si un <img onerror> o un link javascript: inyectados se
      # ejecutan (ADR-012, punto 7). Es lo mismo que make admin-csp-test, sin
      # repetir el build.
      - name: csp
        working-directory: apps/admin
        timeout-minutes: 5
        run: node scripts/check-csp-browser.mjs

  ci:
    name: ci
    needs: [changes, api, admin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
