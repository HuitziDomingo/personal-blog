name: api

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"
  push:
    branches:
      - main
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          working-directory: services/api

      - name: go test
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
