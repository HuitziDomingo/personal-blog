<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Admin · huitzi.xyz</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (function () {
        var root = document.documentElement;
        var mode = null;
        var accent = null;
        try {
          mode = localStorage.getItem('admin-theme');
          accent = localStorage.getItem('admin-accent');
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (['neutral', 'blue', 'green', 'violet', 'amber', 'rose'].indexOf(accent) === -1) {
          accent = 'neutral';
        }
        root.classList.toggle('dark', mode === 'dark');
        root.setAttribute('data-accent', accent);

        // Fondo del login (BLOG-121): uno al azar en cada carga, que lee
        // BackgroundService (fuera del login usa el guardado). La imagen no se
        // precarga (BLOG-146): con las variantes de más calidad, la precarga
        // competía con el JS por la red y retrasaba el LCP del login en móvil.
        // AppBackdrop la pide al montarse, con prioridad baja, y la muestra
        // con un fundido cuando carga.
        var backgrounds = ['fold', 'map', 'sheet', 'blobs', 'glass-chip', 'tarka', 'curvy', 'symbolic', 'dithered-sun', 'balls', 'blendpills', 'lcd-rainbow', 'fedora-42', 'fedora-43', 'fedora-44'];
        if (/\/login\/?$/.test(location.pathname)) {
          root.setAttribute('data-login-background', backgrounds[Math.floor(Math.random() * backgrounds.length)]);
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
