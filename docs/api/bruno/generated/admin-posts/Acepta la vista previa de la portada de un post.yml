info:
  name: Acepta la vista previa de la portada de un post
  type: http
  seq: 7
  tags:
    - admin-posts

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/admin/posts/:id/cover"
  headers:
    - name: access_token
      value: "{{apiKey}}"
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
  params:
    - name: id
      value: ""
      type: path
      description: Identificador del post.
  body:
    type: json
    data: |-
      {
        "image": "",
        "token": "",
        "alt": ""
      }
  auth:
    type: apikey
    key: access_token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

