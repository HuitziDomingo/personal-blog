docs: "Guarda en el almacén de portadas la imagen de una vista previa de generateCoverPreview y la asigna al post como portada generada con IA (ADR-026, puntos 4 y 5). La API no confía en el cliente: `token` es una firma de la propia API sobre la imagen exacta, el post, el usuario y el vencimiento, y además comprueba por sus bytes que la imagen es un JPEG, PNG o WebP con al menos 512 px en su lado más corto. La guarda tal cual, con su formato, y genera `blurDataUrl`. Un token inválido o vencido, o una imagen distinta de la generada, responde 400. El texto alternativo se puede editar. Esta ruta acepta un cuerpo de hasta 2,7 MiB aunque `MAX_BODY_BYTES` sea menor: la imagen viaja en base64."
