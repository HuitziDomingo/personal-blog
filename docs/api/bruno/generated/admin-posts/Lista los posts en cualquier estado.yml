info:
  name: Lista los posts en cualquier estado
  type: http
  seq: 1
  tags:
    - admin-posts

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/posts"
  headers:
    - name: access_token
      value: "{{apiKey}}"
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
  params:
    - name: status
      value: draft
      type: query
      description: Filtra por estado.
      disabled: true
    - name: status
      value: published
      type: query
      description: Filtra por estado.
      disabled: true
    - name: status
      value: archived
      type: query
      description: Filtra por estado.
      disabled: true
    - name: tag
      value: ""
      type: query
      description: Filtra por etiqueta. Se compara en minúsculas y con los espacios colapsados.
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: Tamaño de la página.
    - name: offset
      value: "0"
      type: query
      description: Posts que se saltan antes de la página.
  auth:
    type: apikey
    key: access_token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

