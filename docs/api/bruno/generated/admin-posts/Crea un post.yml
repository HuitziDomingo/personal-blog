            "tags": [],
            "status": "draft",
            "seo": {
              "title": "",
              "description": "",
              "keywords": [],
              "canonicalUrl": "",
              "ogImageUrl": ""
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
