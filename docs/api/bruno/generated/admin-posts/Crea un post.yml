info:
  name: Crea un post
  type: http
  seq: 2
  tags:
    - admin-posts

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/posts"
  headers:
    - name: access_token
      value: "{{apiKey}}"
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
  body:
    type: json
    data: |-
      {
        "title": "",
        "slug": "",
        "excerpt": "",
        "content": "",
        "tags": [],
        "status": "draft",
        "seo": {
          "title": "",
          "description": "",
          "keywords": [],
          "canonicalUrl": "",
          "ogImageUrl": ""
        }
      }
  auth:
    type: apikey
    key: access_token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Post creado.
    request:
      url: "{{baseUrl}}/api/v1/admin/posts"
      method: POST
