info:
  name: Envía un comentario anónimo a un post publicado
  type: http
  seq: 2
  tags:
    - comments

http:
  method: POST
  url: "{{baseUrl}}/api/v1/posts/:slug/comments"
  params:
    - name: slug
      value: ""
      type: path
      description: Identificador del post en la URL.
  body:
    type: json
    data: |-
      {
        "name": "",
        "content": "",
        "parentId": "",
        "website": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 202 Response
    description: Comentario recibido y en revisión.
    request:
      url: "{{baseUrl}}/api/v1/posts/:slug/comments"
      method: POST
      params:
        - name: slug
          value: ""
          type: path
          description: Identificador del post en la URL.
      body:
        type: json
        data: |-
          {
            "name": "",
            "content": "",
            "parentId": "",
            "website": ""
          }
    response:
      status: 202
      statusText: Accepted
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "pending"
          }
  - name: 400 Response
    description: La petición no cumple el contrato.
    request:
      url: "{{baseUrl}}/api/v1/posts/:slug/comments"
      method: POST
      params:
        - name: slug
          value: ""
          type: path
          description: Identificador del post en la URL.
      body:
        type: json
        data: |-
          {
            "name": "",
            "content": "",
            "parentId": "",
            "website": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 403 Response
    description: Las credenciales no dan permiso, o el Origin está fuera de la allowlist.
    request:
      url: "{{baseUrl}}/api/v1/posts/:slug/comments"
