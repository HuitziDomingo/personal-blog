      params:
        - name: slug
          value: ""
          type: path
          description: Identificador del post en la URL.
      body:
        type: json
        data: |-
          {
            "name": "",
            "content": "",
            "parentId": "",
            "website": ""
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 404 Response
    description: El recurso no existe.
    request:
      url: "{{baseUrl}}/api/v1/posts/:slug/comments"
      method: POST
      params:
        - name: slug
          value: ""
          type: path
          description: Identificador del post en la URL.
      body:
        type: json
        data: |-
          {
            "name": "",
            "content": "",
            "parentId": "",
            "website": ""
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
