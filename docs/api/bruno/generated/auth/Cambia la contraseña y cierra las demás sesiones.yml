info:
  name: Cambia la contraseña y cierra las demás sesiones
  type: http
  seq: 5
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/password"
  headers:
    - name: access_token
      value: "{{apiKey}}"
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
  body:
    type: json
    data: |-
      {
        "currentPassword": "",
        "newPassword": ""
      }
  auth:
    type: apikey
    key: access_token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 Response
    description: Contraseña cambiada; las cookies son de la sesión nueva.
    request:
      url: "{{baseUrl}}/api/v1/auth/password"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      body:
        type: json
        data: |-
          {
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 400 Response
    description: "La petición no cumple el contrato o las reglas de la contraseña. `detail` distingue el caso: `current password is incorrect`, `new password must differ from the current one`, `new password is too short` o `new password is too long` (más de 72 bytes en UTF-8, el límite de bcrypt). La contraseña actual incorrecta es un 400 y no un 401: la sesión sigue siendo válida."
    request:
      url: "{{baseUrl}}/api/v1/auth/password"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      body:
        type: json
        data: |-
          {
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 401 Response
    description: Faltan credenciales o no son válidas.
    request:
      url: "{{baseUrl}}/api/v1/auth/password"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      body:
        type: json
        data: |-
          {
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 403 Response
    description: Las credenciales no dan permiso, o el Origin está fuera de la allowlist.
    request:
      url: "{{baseUrl}}/api/v1/auth/password"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      body:
        type: json
        data: |-
          {
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 413 Response
    description: El cuerpo supera el tamaño máximo.
    request:
      url: "{{baseUrl}}/api/v1/auth/password"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      body:
        type: json
        data: |-
          {
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      status: 413
      statusText: Payload Too Large
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 429 Response
    description: Se superó el límite de peticiones de la IP, o el de logins fallidos del email.
    request:
      url: "{{baseUrl}}/api/v1/auth/password"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      body:
        type: json
        data: |-
          {
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: default Response
    description: Error inesperado.
    request:
      url: "{{baseUrl}}/api/v1/auth/password"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      body:
        type: json
        data: |-
          {
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }

docs: Comprueba la contraseña actual, guarda el hash bcrypt de la nueva y revoca todos los refresh tokens del usuario, también el de esta sesión (ADR-032). La respuesta abre una sesión nueva en este dispositivo con cookies nuevas. Los JWT de acceso ya emitidos en otros dispositivos siguen valiendo hasta que vencen (15 minutos como mucho). Tiene un límite propio de 5 intentos por usuario cada 15 minutos, cuente o no la contraseña actual.
