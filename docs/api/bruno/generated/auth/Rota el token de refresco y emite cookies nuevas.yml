info:
  name: Rota el token de refresco y emite cookies nuevas
  type: http
  seq: 2
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/refresh"
  headers:
    - name: refresh_token
      value: "{{apiKey}}"
      description: Token de refresco, en cookie HttpOnly con Path=/api/v1/auth (ADR-005).
  auth:
    type: apikey
    key: refresh_token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 Response
    description: Sesión renovada.
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
      headers:
        - name: refresh_token
          value: "{{apiKey}}"
          description: Token de refresco, en cookie HttpOnly con Path=/api/v1/auth (ADR-005).
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Faltan credenciales o no son válidas.
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
      headers:
        - name: refresh_token
          value: "{{apiKey}}"
          description: Token de refresco, en cookie HttpOnly con Path=/api/v1/auth (ADR-005).
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 403 Response
    description: Las credenciales no dan permiso, o el Origin está fuera de la allowlist.
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
      headers:
        - name: refresh_token
          value: "{{apiKey}}"
          description: Token de refresco, en cookie HttpOnly con Path=/api/v1/auth (ADR-005).
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 429 Response
    description: Se superó el límite de peticiones de la IP, o el de logins fallidos del email.
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
      headers:
        - name: refresh_token
          value: "{{apiKey}}"
          description: Token de refresco, en cookie HttpOnly con Path=/api/v1/auth (ADR-005).
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: default Response
    description: Error inesperado.
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
      headers:
        - name: refresh_token
          value: "{{apiKey}}"
          description: Token de refresco, en cookie HttpOnly con Path=/api/v1/auth (ADR-005).
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
