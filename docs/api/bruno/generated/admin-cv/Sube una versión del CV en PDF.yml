docs: El cuerpo es el PDF tal cual, de 2 MB como máximo. La API comprueba que empiece con la firma %PDF- (no se fía de la extensión ni del tipo que declara el cliente), genera el nombre del archivo y deja la versión nueva como la vigente de su idioma. Tiene su propio límite de peticiones.
