  - name: default Response
    description: Error inesperado.
    request:
      url: "{{baseUrl}}/api/v1/admin/cv/:language"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      params:
        - name: language
