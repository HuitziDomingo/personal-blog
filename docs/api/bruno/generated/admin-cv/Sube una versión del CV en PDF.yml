    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 403 Response
    description: Las credenciales no dan permiso, o el Origin está fuera de la allowlist.
    request:
      url: "{{baseUrl}}/api/v1/admin/cv/:language"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      params:
        - name: language
          value: es
