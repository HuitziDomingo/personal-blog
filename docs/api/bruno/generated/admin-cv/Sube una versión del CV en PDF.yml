info:
  name: Sube una versión del CV en PDF
  type: http
  seq: 2
  tags:
    - admin-cv

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/cv/:language"
  headers:
    - name: access_token
      value: "{{apiKey}}"
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
  params:
    - name: language
      value: es
      type: path
      description: Idioma del CV.
    - name: language
      value: en
      type: path
      description: Idioma del CV.
      disabled: true
  auth:
    type: apikey
    key: access_token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Versión guardada, ya vigente.
    request:
      url: "{{baseUrl}}/api/v1/admin/cv/:language"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      params:
        - name: language
          value: es
          type: path
          description: Idioma del CV.
        - name: language
          value: en
          type: path
          description: Idioma del CV.
          disabled: true
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "language": "es",
            "url": "",
            "size": 0,
            "uploadedAt": "",
            "current": false
          }
  - name: 400 Response
    description: La petición no cumple el contrato.
    request:
      url: "{{baseUrl}}/api/v1/admin/cv/:language"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      params:
        - name: language
          value: es
          type: path
          description: Idioma del CV.
        - name: language
          value: en
          type: path
          description: Idioma del CV.
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 401 Response
    description: Faltan credenciales o no son válidas.
    request:
      url: "{{baseUrl}}/api/v1/admin/cv/:language"
