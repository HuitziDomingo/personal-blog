info:
  name: Lista las versiones del CV
  type: http
  seq: 1
  tags:
    - admin-cv

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/cv"
  headers:
    - name: access_token
      value: "{{apiKey}}"
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
  auth:
    type: apikey
    key: access_token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Versiones del CV.
    request:
      url: "{{baseUrl}}/api/v1/admin/cv"
      method: GET
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "id": "",
                "language": "es",
                "url": "",
                "size": 0,
                "uploadedAt": "",
                "current": false
              }
            ]
          }
  - name: 401 Response
    description: Faltan credenciales o no son válidas.
    request:
      url: "{{baseUrl}}/api/v1/admin/cv"
      method: GET
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 403 Response
    description: Las credenciales no dan permiso, o el Origin está fuera de la allowlist.
    request:
      url: "{{baseUrl}}/api/v1/admin/cv"
      method: GET
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 429 Response
    description: Se superó el límite de peticiones de la IP, o el de logins fallidos del email.
    request:
      url: "{{baseUrl}}/api/v1/admin/cv"
      method: GET
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: default Response
    description: Error inesperado.
    request:
      url: "{{baseUrl}}/api/v1/admin/cv"
      method: GET
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }

docs: Versiones de los dos idiomas, de la más reciente a la más antigua, hasta 200.
