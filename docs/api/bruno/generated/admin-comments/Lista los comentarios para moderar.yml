info:
  name: Lista los comentarios para moderar
  type: http
  seq: 1
  tags:
    - admin-comments

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/comments"
  headers:
    - name: access_token
      value: "{{apiKey}}"
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
  params:
    - name: status
      value: pending
      type: query
      description: Filtra por estado. Sin él, lista todos.
      disabled: true
    - name: status
      value: approved
      type: query
      description: Filtra por estado. Sin él, lista todos.
      disabled: true
    - name: status
      value: rejected
      type: query
      description: Filtra por estado. Sin él, lista todos.
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: Tamaño de la página.
    - name: offset
      value: "0"
      type: query
      description: Elementos que se saltan antes de la página.
  auth:
    type: apikey
    key: access_token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

