info:
  name: Responde a un comentario como autor
  type: http
  seq: 4
  tags:
    - admin-comments

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/comments/:id/replies"
  headers:
    - name: access_token
      value: "{{apiKey}}"
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
  params:
    - name: id
      value: ""
      type: path
      description: Identificador del comentario.
  body:
    type: json
    data: |-
      {
        "content": ""
      }
  auth:
    type: apikey
    key: access_token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Respuesta publicada.
    request:
      url: "{{baseUrl}}/api/v1/admin/comments/:id/replies"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      params:
        - name: id
          value: ""
          type: path
          description: Identificador del comentario.
      body:
        type: json
        data: |-
          {
            "content": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "postId": "",
            "postTitle": "",
            "postSlug": "",
            "parentId": "",
            "name": "",
            "content": "",
            "status": "pending",
            "byAuthor": false,
            "moderation": {
              "verdict": "approve",
              "category": "none",
              "reason": "",
              "model": "",
              "analyzedAt": ""
            },
            "createdAt": "",
            "reviewedAt": ""
          }
