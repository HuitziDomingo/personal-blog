info:
  name: Mejora la redacción de un borrador
  type: http
  seq: 1
  tags:
    - admin-assistant

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/assistant/improve-writing"
  headers:
    - name: access_token
      value: "{{apiKey}}"
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
  body:
    type: json
    data: |-
      {
        "title": "",
        "content": ""
      }
  auth:
    type: apikey
    key: access_token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

