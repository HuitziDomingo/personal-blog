docs: "Workflow de RAG (ADR-027): el borrador se convierte en embedding de consulta, se recuperan los 4 fragmentos más parecidos de los posts publicados que superan el umbral (sin los del post `postId`) y se pide una sugerencia con ellos como contexto. Si ninguno supera el umbral, la sugerencia se pide sin contexto y `context` llega vacío. Es una sugerencia: no se guarda. Los links y las contradicciones solo pueden apuntar a posts de `context`. Comparte el límite por usuario del asistente (ADR-021)."
