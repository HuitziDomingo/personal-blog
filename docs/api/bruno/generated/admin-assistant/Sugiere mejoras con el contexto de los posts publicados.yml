info:
  name: Sugiere mejoras con el contexto de los posts publicados
  type: http
  seq: 4
  tags:
    - admin-assistant

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/assistant/improve-with-context"
  headers:
    - name: access_token
      value: "{{apiKey}}"
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
  body:
    type: json
    data: |-
      {
        "postId": "",
        "title": "",
        "content": ""
      }
  auth:
    type: apikey
    key: access_token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Sugerencia y fragmentos usados como contexto.
    request:
      url: "{{baseUrl}}/api/v1/admin/assistant/improve-with-context"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      body:
        type: json
        data: |-
          {
            "postId": "",
            "title": "",
            "content": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "suggestion": "",
            "internalLinks": [
              {
                "slug": "",
                "reason": ""
              }
            ],
            "contradictions": [
              {
                "slug": "",
                "note": ""
              }
            ],
            "context": [
              {
                "postId": "",
                "slug": "",
                "title": "",
                "section": "",
                "score": 0
              }
            ]
          }
  - name: 400 Response
    description: La petición no cumple el contrato.
    request:
      url: "{{baseUrl}}/api/v1/admin/assistant/improve-with-context"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
      body:
        type: json
        data: |-
          {
            "postId": "",
            "title": "",
            "content": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 401 Response
    description: Faltan credenciales o no son válidas.
    request:
      url: "{{baseUrl}}/api/v1/admin/assistant/improve-with-context"
      method: POST
      headers:
        - name: access_token
          value: "{{apiKey}}"
          description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
