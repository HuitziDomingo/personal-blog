info:
  name: Lista los posts publicados
  type: http
  seq: 1
  tags:
    - posts

http:
  method: GET
  url: "{{baseUrl}}/api/v1/posts"
  params:
    - name: tag
      value: ""
      type: query
      description: Filtra por etiqueta. Se compara en minúsculas y con los espacios colapsados.
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: Tamaño de la página.
    - name: offset
      value: "0"
      type: query
      description: Posts que se saltan antes de la página.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Página de posts publicados.
    request:
      url: "{{baseUrl}}/api/v1/posts"
      method: GET
      params:
        - name: tag
          value: ""
          type: query
          description: Filtra por etiqueta. Se compara en minúsculas y con los espacios colapsados.
          disabled: true
        - name: limit
          value: "20"
          type: query
          description: Tamaño de la página.
        - name: offset
          value: "0"
          type: query
          description: Posts que se saltan antes de la página.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "id": "",
                "authorId": "",
                "title": "",
                "slug": "",
                "excerpt": "",
                "tags": [],
                "status": "draft",
                "publishedAt": "",
                "createdAt": "",
                "updatedAt": ""
              }
            ],
            "total": 0,
            "limit": 0,
            "offset": 0
          }
  - name: 400 Response
    description: La petición no cumple el contrato.
    request:
      url: "{{baseUrl}}/api/v1/posts"
      method: GET
      params:
        - name: tag
          value: ""
          type: query
          description: Filtra por etiqueta. Se compara en minúsculas y con los espacios colapsados.
          disabled: true
        - name: limit
          value: "20"
          type: query
          description: Tamaño de la página.
        - name: offset
          value: "0"
          type: query
          description: Posts que se saltan antes de la página.
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 429 Response
    description: Se superó el límite de peticiones de la IP, o el de logins fallidos del email.
    request:
      url: "{{baseUrl}}/api/v1/posts"
      method: GET
      params:
        - name: tag
          value: ""
          type: query
          description: Filtra por etiqueta. Se compara en minúsculas y con los espacios colapsados.
          disabled: true
        - name: limit
          value: "20"
          type: query
          description: Tamaño de la página.
        - name: offset
          value: "0"
          type: query
          description: Posts que se saltan antes de la página.
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: default Response
    description: Error inesperado.
    request:
      url: "{{baseUrl}}/api/v1/posts"
      method: GET
      params:
        - name: tag
          value: ""
          type: query
          description: Filtra por etiqueta. Se compara en minúsculas y con los espacios colapsados.
          disabled: true
        - name: limit
          value: "20"
          type: query
          description: Tamaño de la página.
        - name: offset
          value: "0"
          type: query
          description: Posts que se saltan antes de la página.
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
