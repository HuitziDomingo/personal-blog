info:
  name: 6 Estado del RAG desactivado
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/rag/status"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("says rag is disabled", function () {
          expect(res.body.enabled).to.equal(false);
          expect(res.body.model).to.equal("");
          expect(res.body.pendingPosts).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
