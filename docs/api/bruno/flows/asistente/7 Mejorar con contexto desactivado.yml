info:
  name: 7 Mejorar con contexto desactivado
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/assistant/improve-with-context"
  body:
    type: json
    data: |-
      {
        "title": "Hola",
        "content": "# Hola\n\nUn borrador de prueba."
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "503"
  scripts:
    - type: tests
      code: |-
        test("says rag is disabled", function () {
          expect(res.getHeader("content-type")).to.include("application/problem+json");
          expect(res.body.detail).to.equal("rag is disabled");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
