info:
  name: 3 Archivo que no es PDF
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/cv/es"
  headers:
    - name: Content-Type
      value: application/pdf
  body:
    type: text
    data: "<html><script>alert(1)</script></html>"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("checks the signature, not the declared type", function () {
          expect(res.body.detail).to.equal("file must be a PDF");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
