info:
  name: 7 Lectura publica con PDF
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns the current spanish pdf", function () {
          expect(res.body.es.url).to.equal(bru.getVar("cvUrl"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
