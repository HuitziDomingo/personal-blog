info:
  name: 5 Listar versiones
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/cv"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("lists the new version first", function () {
          expect(res.body.items[0].id).to.equal(bru.getVar("cvId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
