info:
  name: 6 Marcar vigente
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/cv/versions/{{cvId}}/current"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.current
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
