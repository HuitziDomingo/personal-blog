info:
  name: 7 Sigue sin portada
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/posts/{{postId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("the post still has no cover", function () {
          expect(res.body.cover).to.equal(undefined);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
