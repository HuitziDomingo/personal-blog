info:
  name: 2 Me
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.role
      operator: eq
      value: admin
    - expression: res.body.id
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
