info:
  name: 1 Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.role
      operator: eq
      value: admin
  scripts:
    - type: tests
      code: |-
        const cookies = [].concat(res.getHeader("set-cookie") || []);
        const find = (name) => cookies.find((c) => c.startsWith(name + "="));

        test("sets the access cookie", function () {
          const cookie = find("access_token");
          expect(cookie).to.include("Path=/;");
          expect(cookie).to.include("Max-Age=900");
          expect(cookie).to.include("HttpOnly");
          expect(cookie).to.include("Secure");
          expect(cookie).to.include("SameSite=Strict");
        });

        test("sets the refresh cookie", function () {
          const cookie = find("refresh_token");
          expect(cookie).to.include("Path=/api/v1/auth");
          expect(cookie).to.include("Max-Age=604800");
          expect(cookie).to.include("HttpOnly");
          expect(cookie).to.include("Secure");
          expect(cookie).to.include("SameSite=Strict");
        });

        test("does not cache the response", function () {
          expect(res.getHeader("cache-control")).to.equal("no-store");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
