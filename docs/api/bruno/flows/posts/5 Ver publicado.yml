info:
  name: 5 Ver publicado
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/posts/{{postSlug}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{postId}}"
    - expression: res.body.status
      operator: eq
      value: published
  scripts:
    - type: tests
      code: |-
        test("is public and cacheable", function () {
          expect(res.getHeader("cache-control")).to.equal(undefined);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
