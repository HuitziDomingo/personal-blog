info:
  name: 11 Sigue archivado en el admin
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/posts/{{postId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: archived
  scripts:
    - type: tests
      code: |-
        test("keeps the first publishedAt and the slug", function () {
          expect(res.body.publishedAt).to.equal(bru.getVar("publishedAt"));
          expect(res.body.slug).to.equal(bru.getVar("postSlug"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
