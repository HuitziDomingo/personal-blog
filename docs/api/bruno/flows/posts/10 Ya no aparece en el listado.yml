info:
  name: 10 Ya no aparece en el listado
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v1/posts?tag=bruno&limit=100"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("does not list the archived post", function () {
          const ids = res.body.items.map((item) => item.id);
          expect(ids).to.not.include(bru.getVar("postId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
