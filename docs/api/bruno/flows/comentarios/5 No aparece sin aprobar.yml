info:
  name: 5 No aparece sin aprobar
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/posts/{{postSlug}}/comments"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: before-request
      code: |-
        // Con COMMENTS_ENABLED=false el flujo termina en el paso 3.
        if (bru.getVar("commentsEnabled") !== "true") {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("a pending comment is not public", function () {
          expect(res.body.items).to.eql([]);
          expect(res.body.total).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
