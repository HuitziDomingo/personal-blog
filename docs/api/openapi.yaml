openapi: 3.0.3

info:
  title: huitzi.xyz API
  version: 0.1.0
  description: Contrato de la API del blog. Ver ADR-007.

tags:
  - name: auth
    description: Sesión del administrador.
  - name: posts
    description: Lectura pública de posts publicados.
  - name: admin-posts
    description: Gestión de posts desde el dashboard.
  - name: admin-assistant
    description: >-
      Asistente de escritura con IA (ADR-021). Sus respuestas son sugerencias:
      la API no guarda nada.

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y emite las cookies de acceso y refresco.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rota el token de refresco y emite cookies nuevas.
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Sesión renovada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoca el token de refresco, si llega, y borra las cookies.
      description: >-
        No exige cookie: sin ella, o con un token desconocido, también responde
        204 y borra las cookies.
      security: []
      responses:
        "204":
          description: Sesión cerrada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Devuelve el usuario de la sesión actual.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/posts:
    get:
      tags: [posts]
      operationId: listPublishedPosts
      summary: Lista los posts publicados.
      security: []
      parameters:
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de posts publicados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/posts/{slug}:
    get:
      tags: [posts]
      operationId: getPublishedPost
      summary: Devuelve un post publicado por su slug.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Post publicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/posts:
    get:
      tags: [admin-posts]
      operationId: listPosts
      summary: Lista los posts en cualquier estado.
      security:
        - accessCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra por estado.
          schema:
            $ref: "#/components/schemas/PostStatus"
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [admin-posts]
      operationId: createPost
      summary: Crea un post.
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWrite"
      responses:
        "201":
          description: Post creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/assistant/improve-writing:
    post:
      tags: [admin-assistant]
      operationId: improveWriting
      summary: Mejora la redacción de un borrador.
      description: >-
        Devuelve el contenido reescrito en Markdown. Es una sugerencia: no se
        guarda. Tiene su propio límite por usuario, más estricto que el general
        (ADR-021).
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDraft"
      responses:
        "200":
          description: Contenido con la redacción mejorada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImprovedWriting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AssistantUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/assistant/suggest-metadata:
    post:
      tags: [admin-assistant]
      operationId: suggestMetadata
      summary: Sugiere título, extracto y etiquetas para un borrador.
      description: >-
        Devuelve metadatos que cumplen las mismas reglas que un post. Es una
        sugerencia: no se guarda. Tiene su propio límite por usuario, más
        estricto que el general (ADR-021).
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDraft"
      responses:
        "200":
          description: Metadatos sugeridos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSuggestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AssistantUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del post.
        schema:
          type: string
          minLength: 1
    get:
      tags: [admin-posts]
      operationId: getPost
      summary: Devuelve un post en cualquier estado.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    put:
      tags: [admin-posts]
      operationId: updatePost
      summary: Reemplaza los datos editables de un post.
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWrite"
      responses:
        "200":
          description: Post actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      tags: [admin-posts]
      operationId: deletePost
      summary: Archiva un post.
      description: No hay borrado físico. El post pasa a `archived`, deja de verse en la API pública y conserva su slug y su `publishedAt`. Archivar un post archivado no cambia nada.
      security:
        - accessCookie: []
      responses:
        "204":
          description: Post archivado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Token de refresco, en cookie HttpOnly con Path=/api/v1/auth (ADR-005).

  headers:
    SessionCookies:
      description: >-
        Fija o borra las cookies access_token y refresh_token. La respuesta lleva
        una cabecera Set-Cookie por cada cookie.
      schema:
        type: string

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Identificador del post en la URL.
      schema:
        $ref: "#/components/schemas/Slug"
    Tag:
      name: tag
      in: query
      required: false
      description: Filtra por etiqueta. Se compara en minúsculas y con los espacios colapsados.
      schema:
        type: string
        minLength: 1
        maxLength: 50
    Limit:
      name: limit
      in: query
      required: false
      description: Tamaño de la página.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Posts que se saltan antes de la página.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 10000
        default: 0

  responses:
    BadRequest:
      description: La petición no cumple el contrato.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Faltan credenciales o no son válidas.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Las credenciales no dan permiso, o el Origin está fuera de la allowlist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: El slug ya está en uso, o el post ya se publicó alguna vez y su slug no puede cambiar.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: El cuerpo supera el tamaño máximo.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Se superó el límite de peticiones de la IP, o el de logins fallidos del email.
      headers:
        Retry-After:
          description: >-
            Segundos que faltan para el siguiente intento. Se expone a los
            orígenes permitidos con Access-Control-Expose-Headers.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AssistantUnavailable:
      description: >-
        El asistente está desactivado (ASSISTANT_ENABLED=false), el proveedor
        falló o agotó su cuota, o devolvió una sugerencia que no cumple las
        reglas. `detail` dice cuál.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnexpectedError:
      description: Error inesperado.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: Detalle de un error según RFC 9457.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Identifica el tipo de problema.
        title:
          type: string
          description: Resumen legible del tipo de problema.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: Código de estado HTTP.
        detail:
          type: string
          description: Explicación de este caso concreto.
        instance:
          type: string
          format: uri-reference
          description: Identifica este caso concreto.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1

    UserRole:
      type: string
      enum: [admin]

    User:
      type: object
      description: Cuenta de administración, sin datos de credenciales.
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"

    PostStatus:
      type: string
      enum: [draft, published, archived]

    Slug:
      type: string
      minLength: 1
      maxLength: 80
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

    Seo:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 300
        keywords:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        canonicalUrl:
          type: string
          format: uri
          maxLength: 2048
        ogImageUrl:
          type: string
          format: uri
          maxLength: 2048

    PostWrite:
      type: object
      description: >-
        Datos editables de un post. `slug` es opcional: si falta, se genera del
        título al crear y se conserva el actual al editar; solo cambia mientras
        el post es un borrador que nunca se publicó, y si no, responde 409.
        Publicar fija `publishedAt` solo la primera vez.
      required: [title, content, status]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: "#/components/schemas/Slug"
        excerpt:
          type: string
          maxLength: 500
          description: Opcional. Si falta o está vacío, se generan los primeros ~160 caracteres del contenido sin Markdown.
        content:
          type: string
          description: Contenido en Markdown. Se guarda tal cual; la API nunca lo convierte a HTML.
          minLength: 1
        tags:
          type: array
          maxItems: 20
          description: Se guardan en minúsculas, con los espacios colapsados y sin duplicados.
          items:
            type: string
            minLength: 1
            maxLength: 50
        status:
          $ref: "#/components/schemas/PostStatus"
        seo:
          $ref: "#/components/schemas/Seo"

    AssistantDraft:
      type: object
      description: >-
        El borrador que se envía al asistente. Solo el título y el contenido:
        nunca datos de usuarios ni otros posts (ADR-021).
      required: [title, content]
      properties:
        title:
          type: string
          maxLength: 200
          description: Puede estar vacío.
        content:
          type: string
          description: Contenido en Markdown.
          minLength: 1
          maxLength: 50000

    ImprovedWriting:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: >-
            Contenido sugerido en Markdown. Es texto no confiable: se renderiza
            con el mismo sanitizado que cualquier post (packages/markdown).

    MetadataSuggestion:
      type: object
      description: Metadatos sugeridos, con las mismas reglas que en PostWrite.
      required: [title, excerpt, tags]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        excerpt:
          type: string
          minLength: 1
          maxLength: 500
        tags:
          type: array
          maxItems: 20
          description: En minúsculas, con los espacios colapsados y sin duplicados.
          items:
            type: string
            minLength: 1
            maxLength: 50

    PostSummary:
      type: object
      description: Datos de un post para listados, sin su contenido.
      required: [id, authorId, title, slug, tags, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        authorId:
          type: string
        title:
          type: string
        slug:
          $ref: "#/components/schemas/Slug"
        excerpt:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/PostStatus"
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Nulo mientras no se haya publicado.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Post:
      description: Post completo.
      allOf:
        - $ref: "#/components/schemas/PostSummary"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: Contenido en Markdown.
            seo:
              $ref: "#/components/schemas/Seo"

    PostPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostSummary"
        total:
          type: integer
          format: int64
          description: Total de posts que cumplen el filtro.
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
