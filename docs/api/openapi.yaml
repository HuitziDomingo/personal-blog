openapi: 3.0.3

info:
  title: huitzi.xyz API
  version: 0.1.0
  description: Contrato de la API del blog. Ver ADR-007.

tags:
  - name: auth
    description: Sesión del administrador.
  - name: posts
    description: Lectura pública de posts publicados.
  - name: admin-posts
    description: Gestión de posts desde el dashboard.
  - name: comments
    description: >-
      Comentarios de los lectores en los posts publicados (ADR-022). Envío
      anónimo con premoderación: nada se publica sin la aprobación del autor.
  - name: admin-comments
    description: Cola de moderación de comentarios y respuestas del autor (ADR-022).
  - name: admin-assistant
    description: >-
      Asistente de escritura con IA (ADR-021). Sus respuestas son sugerencias:
      la API no guarda nada.
  - name: cv
    description: Lectura pública del CV en PDF vigente de cada idioma (ADR-028).
  - name: admin-cv
    description: >-
      Subida y versiones del CV en PDF (ADR-028). El PDF es público: no debe
      incluir el teléfono ni datos privados.
  - name: admin-rag
    description: >-
      Índice de los posts publicados para «mejorar con contexto» (ADR-027).
      Apagado por defecto (RAG_ENABLED=false).

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y emite las cookies de acceso y refresco.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rota el token de refresco y emite cookies nuevas.
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Sesión renovada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoca el token de refresco, si llega, y borra las cookies.
      description: >-
        No exige cookie: sin ella, o con un token desconocido, también responde
        204 y borra las cookies.
      security: []
      responses:
        "204":
          description: Sesión cerrada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Devuelve el usuario de la sesión actual.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/posts:
    get:
      tags: [posts]
      operationId: listPublishedPosts
      summary: Lista los posts publicados.
      security: []
      parameters:
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de posts publicados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/posts/{slug}:
    get:
      tags: [posts]
      operationId: getPublishedPost
      summary: Devuelve un post publicado por su slug.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Post publicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/posts/{slug}/comments:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [comments]
      operationId: listPostComments
      summary: Lista los comentarios aprobados de un post.
      description: >-
        Solo los comentarios aprobados de un post publicado, del más antiguo al
        más reciente, sin datos de moderación. Una respuesta tiene `parentId`
        y solo aparece si su comentario padre está aprobado; `total` cuenta lo
        mismo que se lista.
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de comentarios aprobados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCommentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [comments]
      operationId: submitComment
      summary: Envía un comentario anónimo a un post publicado.
      description: >-
        El comentario queda en revisión hasta que el autor lo aprueba. La
        respuesta siempre es la misma y no revela ningún análisis. Con
        COMMENTS_ENABLED=false responde 404. Tiene su propio límite por IP, más
        estricto que el general (ADR-022).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentSubmission"
      responses:
        "202":
          description: Comentario recibido y en revisión.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/posts:
    get:
      tags: [admin-posts]
      operationId: listPosts
      summary: Lista los posts en cualquier estado.
      security:
        - accessCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra por estado.
          schema:
            $ref: "#/components/schemas/PostStatus"
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [admin-posts]
      operationId: createPost
      summary: Crea un post.
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWrite"
      responses:
        "201":
          description: Post creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/assistant/improve-writing:
    post:
      tags: [admin-assistant]
      operationId: improveWriting
      summary: Mejora la redacción de un borrador.
      description: >-
        Devuelve el contenido reescrito en Markdown. Es una sugerencia: no se
        guarda. Tiene su propio límite por usuario, más estricto que el general
        (ADR-021).
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDraft"
      responses:
        "200":
          description: Contenido con la redacción mejorada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImprovedWriting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AssistantUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/assistant/suggest-metadata:
    post:
      tags: [admin-assistant]
      operationId: suggestMetadata
      summary: Sugiere título, extracto y etiquetas para un borrador.
      description: >-
        Devuelve metadatos que cumplen las mismas reglas que un post. Es una
        sugerencia: no se guarda. Tiene su propio límite por usuario, más
        estricto que el general (ADR-021).
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDraft"
      responses:
        "200":
          description: Metadatos sugeridos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSuggestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AssistantUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/assistant/suggest-cover:
    post:
      tags: [admin-assistant]
      operationId: suggestCover
      summary: Sugiere la idea de la portada de un borrador.
      description: >-
        Devuelve el tema de la imagen de portada y su texto alternativo, en
        texto: no genera ninguna imagen (ADR-026, punto 2). Es una sugerencia:
        no se guarda. La API valida el largo y los caracteres de los dos campos
        antes de devolverlos, y si el modelo no los cumple responde 503 sin
        reintentar. Comparte el límite por usuario del asistente (ADR-021).
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDraft"
      responses:
        "200":
          description: Idea de portada sugerida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverSuggestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AssistantUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/assistant/improve-with-context:
    post:
      tags: [admin-assistant]
      operationId: improveWithContext
      summary: Sugiere mejoras con el contexto de los posts publicados.
      description: >-
        Workflow de RAG (ADR-027): el borrador se convierte en embedding de
        consulta, se recuperan los 4 fragmentos más parecidos de los posts
        publicados que superan el umbral (sin los del post `postId`) y se pide
        una sugerencia con ellos como contexto. Si ninguno supera el umbral,
        la sugerencia se pide sin contexto y `context` llega vacío. Es una
        sugerencia: no se guarda. Los links y las contradicciones solo pueden
        apuntar a posts de `context`. Comparte el límite por usuario del
        asistente (ADR-021).
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextDraft"
      responses:
        "200":
          description: Sugerencia y fragmentos usados como contexto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextualSuggestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/RagUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/rag/status:
    get:
      tags: [admin-rag]
      operationId: getRagStatus
      summary: Devuelve el estado del índice de posts.
      description: >-
        Dice si el RAG está encendido y cuántos posts publicados están
        indexados al día con el modelo actual y cuántos pendientes. Con el RAG
        apagado responde 200 con `enabled: false`: el admin lo usa para
        mostrar u ocultar «Mejorar con mi contexto» y «Reindexar todo».
      security:
        - accessCookie: []
      responses:
        "200":
          description: Estado del índice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/rag/reindex:
    post:
      tags: [admin-rag]
      operationId: reindexPosts
      summary: Reconstruye el índice de posts.
      description: >-
        Vuelve a generar los embeddings de todos los posts publicados y borra
        los fragmentos de los que ya no lo están (ADR-027, punto 5). Cada post
        se reemplaza solo si sus embeddings se generaron. Al primer fallo del
        proveedor (por ejemplo, cuota agotada) se detiene y los posts
        restantes quedan en `pending`, con su índice anterior. Comparte el
        límite por usuario del asistente.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Resultado del reindexado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/RagUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del post.
        schema:
          type: string
          minLength: 1
    get:
      tags: [admin-posts]
      operationId: getPost
      summary: Devuelve un post en cualquier estado.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    put:
      tags: [admin-posts]
      operationId: updatePost
      summary: Reemplaza los datos editables de un post.
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWrite"
      responses:
        "200":
          description: Post actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      tags: [admin-posts]
      operationId: deletePost
      summary: Archiva un post.
      description: No hay borrado físico. El post pasa a `archived`, deja de verse en la API pública y conserva su slug y su `publishedAt`. Archivar un post archivado no cambia nada.
      security:
        - accessCookie: []
      responses:
        "204":
          description: Post archivado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/posts/{id}/cover/preview:
    parameters:
      - $ref: "#/components/parameters/PostId"
    post:
      tags: [admin-posts]
      operationId: generateCoverPreview
      summary: Genera la vista previa de la portada de un post.
      description: >-
        Pide a Gemini la idea de la portada del post guardado (tema y texto
        alternativo, como suggestCover) y genera la imagen con el tema en una
        plantilla cerrada (ADR-026, puntos 1 y 7). Devuelve la imagen tal como
        la generó el proveedor, sin recodificar ni recortar (el recorte 16:9 lo
        hace la web), y NO la guarda (punto 4): para usarla,
        el admin la reenvía con `token` a acceptCover antes de `expiresAt`.
        Sin reintentos. Tiene su propio límite por usuario (punto 8): por
        defecto 2 por minuto y 20 por día.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Vista previa de la portada, sin guardar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ImagesUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/posts/{id}/cover:
    parameters:
      - $ref: "#/components/parameters/PostId"
    put:
      tags: [admin-posts]
      operationId: acceptCover
      summary: Acepta la vista previa de la portada de un post.
      description: >-
        Guarda en el almacén de portadas la imagen de una vista previa de
        generateCoverPreview y la asigna al post como portada generada con IA
        (ADR-026, puntos 4 y 5). La API no confía en el cliente: `token` es una
        firma de la propia API sobre la imagen exacta, el post, el usuario y el
        vencimiento, y además comprueba por sus bytes que la imagen es un JPEG,
        PNG o WebP de al menos 1024 × 576. La guarda tal cual, con su formato,
        y genera `blurDataUrl`. Un token inválido o vencido, o una imagen
        distinta de la generada, responde 400. El texto alternativo se puede
        editar. Esta ruta acepta un cuerpo de hasta 2,7 MiB aunque
        `MAX_BODY_BYTES` sea menor: la imagen viaja en base64.
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverAcceptance"
      responses:
        "200":
          description: Post con su portada nueva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ImagesUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      tags: [admin-posts]
      operationId: removeCover
      summary: Quita la portada de un post.
      description: >-
        El post queda sin portada y se sigue publicando igual (ADR-026, punto
        5). La imagen no se borra del almacén. Quitar la portada de un post sin
        portada no cambia nada.
      security:
        - accessCookie: []
      responses:
        "204":
          description: Post sin portada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/comments:
    get:
      tags: [admin-comments]
      operationId: listComments
      summary: Lista los comentarios para moderar.
      description: >-
        Comentarios de todos los posts, del más antiguo al más reciente, con el
        resultado de la moderación si lo hay.
      security:
        - accessCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra por estado. Sin él, lista todos.
          schema:
            $ref: "#/components/schemas/CommentStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de comentarios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/comments/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [admin-comments]
      operationId: approveComment
      summary: Aprueba un comentario.
      description: El comentario se publica. Aprobar uno aprobado no cambia nada.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Comentario aprobado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/comments/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [admin-comments]
      operationId: rejectComment
      summary: Rechaza un comentario.
      description: >-
        El comentario deja de verse y se borra a los 30 días, salvo que se
        apruebe antes. Rechazar uno rechazado no cambia nada.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Comentario rechazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/comments/{id}/replies:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [admin-comments]
      operationId: replyToComment
      summary: Responde a un comentario como autor.
      description: >-
        La respuesta se publica aprobada y marcada como del autor. Solo se
        responde a un comentario aprobado que no es respuesta de otro: hay un
        solo nivel de respuestas.
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorReply"
      responses:
        "201":
          description: Respuesta publicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/comments/{id}/analyze:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [admin-comments]
      operationId: analyzeComment
      summary: Pide de nuevo el análisis de un comentario.
      description: >-
        Vuelve a pedir al clasificador su sugerencia (ADR-022, punto 5) y la
        guarda en `moderation`, reemplazando la anterior. No cambia el estado
        del comentario: el autor sigue decidiendo.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Comentario con el análisis nuevo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ModerationUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/cv:
    get:
      tags: [cv]
      operationId: getCurrentCV
      summary: Devuelve el CV en PDF vigente de cada idioma.
      description: >-
        Un idioma sin PDF vigente no aparece en la respuesta. El PDF se sirve
        desde el dominio del almacenamiento, nunca desde el de la web ni el del
        admin (ADR-028, punto 6).
      security: []
      responses:
        "200":
          description: PDF vigente por idioma.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCVs"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/cv:
    get:
      tags: [admin-cv]
      operationId: listCVVersions
      summary: Lista las versiones del CV.
      description: >-
        Versiones de los dos idiomas, de la más reciente a la más antigua, hasta
        200.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Versiones del CV.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CVVersionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/cv/{language}:
    parameters:
      - $ref: "#/components/parameters/CVLanguagePath"
    post:
      tags: [admin-cv]
      operationId: uploadCV
      summary: Sube una versión del CV en PDF.
      description: >-
        El cuerpo es el PDF tal cual, de 2 MB como máximo. La API comprueba que
        empiece con la firma %PDF- (no se fía de la extensión ni del tipo que
        declara el cliente), genera el nombre del archivo y deja la versión
        nueva como la vigente de su idioma. Tiene su propio límite de
        peticiones.
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Versión guardada, ya vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CVVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/FileStorageUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/cv/versions/{id}/current:
    parameters:
      - $ref: "#/components/parameters/CVVersionId"
    post:
      tags: [admin-cv]
      operationId: setCurrentCV
      summary: Marca una versión del CV como la vigente.
      description: >-
        La versión pasa a ser la vigente de su idioma y la anterior deja de
        serlo. Marcar la vigente no cambia nada.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Versión vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CVVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Token de refresco, en cookie HttpOnly con Path=/api/v1/auth (ADR-005).

  headers:
    SessionCookies:
      description: >-
        Fija o borra las cookies access_token y refresh_token. La respuesta lleva
        una cabecera Set-Cookie por cada cookie.
      schema:
        type: string

  parameters:
    PostId:
      name: id
      in: path
      required: true
      description: Identificador del post.
      schema:
        type: string
        minLength: 1
    Slug:
      name: slug
      in: path
      required: true
      description: Identificador del post en la URL.
      schema:
        $ref: "#/components/schemas/Slug"
    CommentId:
      name: id
      in: path
      required: true
      description: Identificador del comentario.
      schema:
        type: string
        minLength: 1
        maxLength: 24
    CVLanguagePath:
      name: language
      in: path
      required: true
      description: Idioma del CV.
      schema:
        $ref: "#/components/schemas/CVLanguage"
    CVVersionId:
      name: id
      in: path
      required: true
      description: Identificador de la versión del CV.
      schema:
        type: string
        minLength: 1
        maxLength: 24
    Tag:
      name: tag
      in: query
      required: false
      description: Filtra por etiqueta. Se compara en minúsculas y con los espacios colapsados.
      schema:
        type: string
        minLength: 1
        maxLength: 50
    Limit:
      name: limit
      in: query
      required: false
      description: Tamaño de la página.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Elementos que se saltan antes de la página.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 10000
        default: 0

  responses:
    BadRequest:
      description: La petición no cumple el contrato.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Faltan credenciales o no son válidas.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Las credenciales no dan permiso, o el Origin está fuera de la allowlist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: El slug ya está en uso, o el post ya se publicó alguna vez y su slug no puede cambiar.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: El cuerpo supera el tamaño máximo.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Se superó el límite de peticiones de la IP, o el de logins fallidos del email.
      headers:
        Retry-After:
          description: >-
            Segundos que faltan para el siguiente intento. Se expone a los
            orígenes permitidos con Access-Control-Expose-Headers.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AssistantUnavailable:
      description: >-
        El asistente está desactivado (ASSISTANT_ENABLED=false), el proveedor
        falló o agotó su cuota, o devolvió una sugerencia que no cumple las
        reglas. `detail` dice cuál.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ImagesUnavailable:
      description: >-
        La generación de portadas está desactivada
        (`detail`: "image generation is disabled"), se agotó la cuota diaria
        del proveedor ("image generation quota exhausted, try again tomorrow"),
        el proveedor falló, agotó su tiempo o devolvió una imagen inválida
        ("image generation is unavailable, try again later"), o no se pudo
        guardar la portada ("cover storage is unavailable, try again later").
        La vista previa también puede responder con los 503 del asistente, que
        propone el tema.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ModerationUnavailable:
      description: >-
        La moderación con LLM está desactivada
        (`detail`: "comment moderation is disabled") o el clasificador falló,
        agotó su tiempo o devolvió una salida inválida
        (`detail`: "comment moderation is unavailable").
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FileStorageUnavailable:
      description: >-
        No hay almacenamiento de archivos configurado
        (`detail`: "file storage is not configured") o falló al guardar
        (`detail`: "file storage is unavailable").
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RagUnavailable:
      description: >-
        El RAG está desactivado (`detail`: "rag is disabled"), o el proveedor
        de embeddings o el asistente fallaron, agotaron su cuota o devolvieron
        una salida inválida. `detail` dice cuál.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnexpectedError:
      description: Error inesperado.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    CVLanguage:
      type: string
      description: Idioma del CV.
      enum: [es, en]
    CVFile:
      type: object
      description: PDF vigente de un idioma.
      required: [url, size, uploadedAt]
      properties:
        url:
          type: string
          format: uri
          description: URL pública del PDF, en el dominio del almacenamiento.
        size:
          type: integer
          format: int64
          description: Tamaño en bytes.
        uploadedAt:
          type: string
          format: date-time
    CurrentCVs:
      type: object
      description: PDF vigente por idioma; un idioma sin PDF vigente no aparece.
      properties:
        es:
          $ref: "#/components/schemas/CVFile"
        en:
          $ref: "#/components/schemas/CVFile"
    CVVersion:
      type: object
      description: Una versión subida del CV.
      required: [id, language, url, size, uploadedAt, current]
      properties:
        id:
          type: string
        language:
          $ref: "#/components/schemas/CVLanguage"
        url:
          type: string
          format: uri
        size:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Si es la versión vigente de su idioma.
    CVVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CVVersion"
    Problem:
      type: object
      description: Detalle de un error según RFC 9457.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Identifica el tipo de problema.
        title:
          type: string
          description: Resumen legible del tipo de problema.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: Código de estado HTTP.
        detail:
          type: string
          description: Explicación de este caso concreto.
        instance:
          type: string
          format: uri-reference
          description: Identifica este caso concreto.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1

    UserRole:
      type: string
      enum: [admin]

    User:
      type: object
      description: Cuenta de administración, sin datos de credenciales.
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"

    PostStatus:
      type: string
      enum: [draft, published, archived]

    Slug:
      type: string
      minLength: 1
      maxLength: 80
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

    Seo:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 300
        keywords:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        canonicalUrl:
          type: string
          format: uri
          maxLength: 2048
        ogImageUrl:
          type: string
          format: uri
          maxLength: 2048

    PostWrite:
      type: object
      description: >-
        Datos editables de un post. `slug` es opcional: si falta, se genera del
        título al crear y se conserva el actual al editar; solo cambia mientras
        el post es un borrador que nunca se publicó, y si no, responde 409.
        Publicar fija `publishedAt` solo la primera vez.
      required: [title, content, status]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: "#/components/schemas/Slug"
        excerpt:
          type: string
          maxLength: 500
          description: Opcional. Si falta o está vacío, se generan los primeros ~160 caracteres del contenido sin Markdown.
        content:
          type: string
          description: Contenido en Markdown. Se guarda tal cual; la API nunca lo convierte a HTML.
          minLength: 1
        tags:
          type: array
          maxItems: 20
          description: Se guardan en minúsculas, con los espacios colapsados y sin duplicados.
          items:
            type: string
            minLength: 1
            maxLength: 50
        status:
          $ref: "#/components/schemas/PostStatus"
        seo:
          $ref: "#/components/schemas/Seo"

    AssistantDraft:
      type: object
      description: >-
        El borrador que se envía al asistente. Solo el título y el contenido:
        nunca datos de usuarios ni otros posts (ADR-021).
      required: [title, content]
      properties:
        title:
          type: string
          maxLength: 200
          description: Puede estar vacío.
        content:
          type: string
          description: Contenido en Markdown.
          minLength: 1
          maxLength: 50000

    ImprovedWriting:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: >-
            Contenido sugerido en Markdown. Es texto no confiable: se renderiza
            con el mismo sanitizado que cualquier post (packages/markdown).

    MetadataSuggestion:
      type: object
      description: Metadatos sugeridos, con las mismas reglas que en PostWrite.
      required: [title, excerpt, tags]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        excerpt:
          type: string
          minLength: 1
          maxLength: 500
        tags:
          type: array
          maxItems: 20
          description: En minúsculas, con los espacios colapsados y sin duplicados.
          items:
            type: string
            minLength: 1
            maxLength: 50

    CoverSuggestion:
      type: object
      description: >-
        Idea de portada (ADR-026). Ninguno de los dos campos tiene saltos de
        línea, caracteres de control ni espacios en los extremos.
      required: [subject, alt]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Tema de la imagen, en inglés, para la plantilla cerrada del
            generador de imágenes. Solo letras, marcas diacríticas, dígitos,
            el espacio y `, . ; : ' ( ) -`.
        alt:
          type: string
          minLength: 1
          maxLength: 250
          description: >-
            Texto alternativo de la imagen, en el idioma del borrador. Solo
            letras, marcas diacríticas, dígitos, el espacio y
            `. , ; : ' " ( ) - ¿ ? ¡ ! « » ’ “ ” – — / % &`.

    Cover:
      type: object
      description: >-
        Portada de un post (ADR-026, punto 5). Opcional: un post sin portada se
        publica igual. Si `aiGenerated` es true, la web muestra la leyenda
        «Imagen generada con IA» (punto 6).
      required: [url, alt, aiGenerated]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            URL pública de la imagen, tal como la generó el proveedor (JPEG,
            PNG o WebP de al menos 1024 × 576). La web la recorta a 16:9.
        alt:
          type: string
          maxLength: 250
          description: Texto alternativo de la imagen.
        aiGenerated:
          type: boolean
          description: Si la imagen se generó con IA.
        blurDataUrl:
          type: string
          maxLength: 4096
          pattern: "^data:image/png;base64,[A-Za-z0-9+/=]+$"
          description: >-
            Placeholder diminuto (16 px de ancho, PNG en base64) que la web
            muestra borroso mientras carga la portada. Falta en portadas
            guardadas antes de que existiera.

    CoverPreview:
      type: object
      description: >-
        Vista previa de una portada generada con IA (ADR-026, punto 4). No está
        guardada en ningún sitio: para usarla se reenvían `image` y `token` a
        acceptCover.
      required: [image, contentType, width, height, subject, alt, token, expiresAt]
      properties:
        image:
          type: string
          format: byte
          description: La imagen, en base64. Se muestra como `data:` con `contentType`.
        contentType:
          type: string
          description: Tipo de la imagen, detectado por sus bytes `image/jpeg`, `image/png` o `image/webp`.
        width:
          type: integer
          format: int32
          description: Ancho en píxeles de la imagen del proveedor (al menos 1024).
        height:
          type: integer
          format: int32
          description: Alto en píxeles de la imagen del proveedor (al menos 576).
        subject:
          type: string
          description: Tema que propuso Gemini y que se usó en la plantilla, en inglés.
        alt:
          type: string
          description: Texto alternativo sugerido, en el idioma del post. Se puede editar al aceptar.
        token:
          type: string
          description: >-
            Firma de la API sobre la imagen, el post, el usuario y el
            vencimiento. Se reenvía tal cual a acceptCover.
        expiresAt:
          type: string
          format: date-time
          description: Hasta cuándo se puede aceptar la vista previa.

    CoverAcceptance:
      type: object
      description: La vista previa que se acepta, tal como la devolvió generateCoverPreview.
      required: [image, token, alt]
      properties:
        image:
          type: string
          format: byte
          maxLength: 2796204
          description: La imagen de la vista previa, en base64 (2 MiB como máximo).
        token:
          type: string
          maxLength: 64
          pattern: "^[0-9]{1,12}\\.[A-Za-z0-9_-]{43}$"
          description: El `token` de la vista previa.
        alt:
          type: string
          minLength: 1
          maxLength: 250
          pattern: "^[\\p{L}\\p{M}\\p{N} .,;:'\"()¿?¡!«»’“”–—/%&-]+$"
          description: >-
            Texto alternativo de la portada. Solo letras, marcas diacríticas,
            dígitos, el espacio y `. , ; : ' " ( ) - ¿ ? ¡ ! « » ’ “ ” – — / % &`.
            Se guarda sin espacios en los extremos.

    ContextDraft:
      type: object
      description: >-
        El borrador para «mejorar con contexto». `postId` es el post que se
        está editando: sus propios fragmentos no se usan como contexto.
      required: [title, content]
      properties:
        postId:
          type: string
          minLength: 1
          maxLength: 64
          description: Vacío o ausente si el post todavía no se guardó.
        title:
          type: string
          maxLength: 200
          description: Puede estar vacío.
        content:
          type: string
          description: Contenido en Markdown.
          minLength: 1
          maxLength: 50000

    ContextSource:
      type: object
      description: Un fragmento de un post publicado usado como contexto.
      required: [postId, slug, title, section, score]
      properties:
        postId:
          type: string
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
          description: Título del post.
        section:
          type: string
          description: Título de la sección (encabezado de nivel 2) del fragmento; vacío si es el texto antes de la primera.
        score:
          type: number
          format: double
          minimum: -1
          maximum: 1
          description: Similitud coseno con el borrador.

    InternalLink:
      type: object
      required: [slug, reason]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        reason:
          type: string
          minLength: 1
          maxLength: 300
          description: Dónde y por qué enlazarlo.

    Contradiction:
      type: object
      required: [slug, note]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: Qué dice el borrador y qué dice el post.

    ContextualSuggestion:
      type: object
      required: [suggestion, internalLinks, contradictions, context]
      properties:
        suggestion:
          type: string
          minLength: 1
          maxLength: 20000
          description: >-
            Mejoras sugeridas en Markdown. Es texto no confiable: se renderiza
            con el mismo sanitizado que cualquier post (packages/markdown).
        internalLinks:
          type: array
          maxItems: 4
          description: Links sugeridos, solo a posts de `context` y sin repetir.
          items:
            $ref: "#/components/schemas/InternalLink"
        contradictions:
          type: array
          maxItems: 4
          description: Diferencias con posts de `context`.
          items:
            $ref: "#/components/schemas/Contradiction"
        context:
          type: array
          maxItems: 4
          description: Los fragmentos usados como contexto, del más parecido al menos.
          items:
            $ref: "#/components/schemas/ContextSource"

    RagStatus:
      type: object
      required: [enabled, model, publishedPosts, indexedPosts, pendingPosts, chunks]
      properties:
        enabled:
          type: boolean
        model:
          type: string
          description: Modelo de embeddings; vacío con el RAG apagado.
        publishedPosts:
          type: integer
          minimum: 0
        indexedPosts:
          type: integer
          minimum: 0
          description: Posts publicados con fragmentos al día con el modelo actual.
        pendingPosts:
          type: integer
          minimum: 0
          description: Posts publicados sin indexar o con un índice viejo.
        chunks:
          type: integer
          minimum: 0
          description: Fragmentos de los posts indexados.

    ReindexResult:
      type: object
      required: [posts, indexed, pending, removed, chunks]
      properties:
        posts:
          type: integer
          minimum: 0
          description: Posts publicados.
        indexed:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
          description: Posts que quedaron sin reindexar porque el proveedor falló.
        removed:
          type: integer
          minimum: 0
          description: Posts que ya no están publicados y cuyos fragmentos se borraron.
        chunks:
          type: integer
          minimum: 0
          description: Fragmentos generados.

    PostSummary:
      type: object
      description: Datos de un post para listados, sin su contenido.
      required: [id, authorId, title, slug, tags, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        authorId:
          type: string
        title:
          type: string
        slug:
          $ref: "#/components/schemas/Slug"
        excerpt:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/PostStatus"
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Nulo mientras no se haya publicado.
        cover:
          $ref: "#/components/schemas/Cover"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Post:
      description: Post completo.
      allOf:
        - $ref: "#/components/schemas/PostSummary"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: Contenido en Markdown.
            seo:
              $ref: "#/components/schemas/Seo"

    PostPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostSummary"
        total:
          type: integer
          format: int64
          description: Total de posts que cumplen el filtro.
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32

    CommentStatus:
      type: string
      enum: [pending, approved, rejected]

    CommentSubmission:
      type: object
      description: >-
        Comentario de un lector. Solo texto: la web lo escapa al mostrarlo. No
        se guarda IP, correo ni ningún identificador del lector (ADR-022).
      required: [name, content]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Nombre que se muestra. No se verifica.
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Solo texto, sin Markdown ni HTML.
        parentId:
          type: string
          minLength: 1
          maxLength: 24
          description: >-
            Comentario al que responde. Debe ser un comentario aprobado del
            mismo post que no sea una respuesta.
        website:
          type: string
          maxLength: 200
          description: >-
            Campo trampa: la web lo oculta y una persona lo deja vacío. Si
            llega con valor, el comentario se descarta en silencio con la misma
            respuesta.

    CommentReceipt:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending]
          description: Siempre pending. No revela ningún análisis.

    AuthorReply:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Solo texto, como un comentario.

    PublicComment:
      type: object
      description: Comentario aprobado, sin datos de moderación.
      required: [id, name, content, byAuthor, createdAt]
      properties:
        id:
          type: string
        parentId:
          type: string
          description: Comentario al que responde, si es una respuesta.
        name:
          type: string
        content:
          type: string
          description: Texto no confiable. Se escapa al mostrarlo.
        byAuthor:
          type: boolean
          description: Respuesta del autor del blog.
        createdAt:
          type: string
          format: date-time

    PublicCommentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicComment"
        total:
          type: integer
          format: int64
          description: Total de comentarios aprobados del post.
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32

    ModerationVerdict:
      type: string
      enum: [approve, reject, review]

    ModerationCategory:
      type: string
      enum: [none, spam, abuse, off_topic, prompt_injection, personal_data]

    Moderation:
      type: object
      description: >-
        Sugerencia del clasificador (ADR-022). Solo orienta: el autor decide.
      required: [verdict, category, reason, model, analyzedAt]
      properties:
        verdict:
          $ref: "#/components/schemas/ModerationVerdict"
        category:
          $ref: "#/components/schemas/ModerationCategory"
        reason:
          type: string
        model:
          type: string
        analyzedAt:
          type: string
          format: date-time

    Comment:
      type: object
      description: Comentario completo, para el admin.
      required: [id, postId, name, content, status, byAuthor, createdAt]
      properties:
        id:
          type: string
        postId:
          type: string
        postTitle:
          type: string
          description: >-
            Título actual del post, para la cola de moderación. Falta si el
            post ya no existe.
        postSlug:
          type: string
          description: Slug actual del post. Falta si el post ya no existe.
        parentId:
          type: string
        name:
          type: string
        content:
          type: string
          description: Texto no confiable. Se escapa al mostrarlo.
        status:
          $ref: "#/components/schemas/CommentStatus"
        byAuthor:
          type: boolean
        moderation:
          $ref: "#/components/schemas/Moderation"
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          description: Cuándo el autor lo aprobó o rechazó por última vez.

    CommentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        total:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
