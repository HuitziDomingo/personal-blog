openapi: 3.0.3

info:
  title: huitzi.xyz API
  version: 0.1.0
  description: Contrato de la API del blog. Ver ADR-007.

tags:
  - name: auth
    description: Sesión del administrador.
  - name: posts
    description: Lectura pública de posts publicados.
  - name: admin-posts
    description: Gestión de posts desde el dashboard.
  - name: comments
    description: >-
      Comentarios de los lectores en los posts publicados (ADR-022). Envío
      anónimo con premoderación: nada se publica sin la aprobación del autor.
  - name: admin-comments
    description: Cola de moderación de comentarios y respuestas del autor (ADR-022).
  - name: admin-assistant
    description: >-
      Asistente de escritura con IA (ADR-021). Sus respuestas son sugerencias:
      la API no guarda nada.

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y emite las cookies de acceso y refresco.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rota el token de refresco y emite cookies nuevas.
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Sesión renovada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoca el token de refresco, si llega, y borra las cookies.
      description: >-
        No exige cookie: sin ella, o con un token desconocido, también responde
        204 y borra las cookies.
      security: []
      responses:
        "204":
          description: Sesión cerrada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Devuelve el usuario de la sesión actual.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/posts:
    get:
      tags: [posts]
      operationId: listPublishedPosts
      summary: Lista los posts publicados.
      security: []
      parameters:
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de posts publicados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/posts/{slug}:
    get:
      tags: [posts]
      operationId: getPublishedPost
      summary: Devuelve un post publicado por su slug.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Post publicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/posts/{slug}/comments:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [comments]
      operationId: listPostComments
      summary: Lista los comentarios aprobados de un post.
      description: >-
        Solo los comentarios aprobados de un post publicado, del más antiguo al
        más reciente, sin datos de moderación. Una respuesta tiene `parentId`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de comentarios aprobados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCommentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [comments]
      operationId: submitComment
      summary: Envía un comentario anónimo a un post publicado.
      description: >-
        El comentario queda en revisión hasta que el autor lo aprueba. La
        respuesta siempre es la misma y no revela ningún análisis. Con
        COMMENTS_ENABLED=false responde 404. Tiene su propio límite por IP, más
        estricto que el general (ADR-022).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentSubmission"
      responses:
        "202":
          description: Comentario recibido y en revisión.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/posts:
    get:
      tags: [admin-posts]
      operationId: listPosts
      summary: Lista los posts en cualquier estado.
      security:
        - accessCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra por estado.
          schema:
            $ref: "#/components/schemas/PostStatus"
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [admin-posts]
      operationId: createPost
      summary: Crea un post.
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWrite"
      responses:
        "201":
          description: Post creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/assistant/improve-writing:
    post:
      tags: [admin-assistant]
      operationId: improveWriting
      summary: Mejora la redacción de un borrador.
      description: >-
        Devuelve el contenido reescrito en Markdown. Es una sugerencia: no se
        guarda. Tiene su propio límite por usuario, más estricto que el general
        (ADR-021).
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDraft"
      responses:
        "200":
          description: Contenido con la redacción mejorada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImprovedWriting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AssistantUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/assistant/suggest-metadata:
    post:
      tags: [admin-assistant]
      operationId: suggestMetadata
      summary: Sugiere título, extracto y etiquetas para un borrador.
      description: >-
        Devuelve metadatos que cumplen las mismas reglas que un post. Es una
        sugerencia: no se guarda. Tiene su propio límite por usuario, más
        estricto que el general (ADR-021).
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDraft"
      responses:
        "200":
          description: Metadatos sugeridos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSuggestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AssistantUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del post.
        schema:
          type: string
          minLength: 1
    get:
      tags: [admin-posts]
      operationId: getPost
      summary: Devuelve un post en cualquier estado.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    put:
      tags: [admin-posts]
      operationId: updatePost
      summary: Reemplaza los datos editables de un post.
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWrite"
      responses:
        "200":
          description: Post actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      tags: [admin-posts]
      operationId: deletePost
      summary: Archiva un post.
      description: No hay borrado físico. El post pasa a `archived`, deja de verse en la API pública y conserva su slug y su `publishedAt`. Archivar un post archivado no cambia nada.
      security:
        - accessCookie: []
      responses:
        "204":
          description: Post archivado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/comments:
    get:
      tags: [admin-comments]
      operationId: listComments
      summary: Lista los comentarios para moderar.
      description: >-
        Comentarios de todos los posts, del más antiguo al más reciente, con el
        resultado de la moderación si lo hay.
      security:
        - accessCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra por estado. Sin él, lista todos.
          schema:
            $ref: "#/components/schemas/CommentStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de comentarios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/comments/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [admin-comments]
      operationId: approveComment
      summary: Aprueba un comentario.
      description: El comentario se publica. Aprobar uno aprobado no cambia nada.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Comentario aprobado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/comments/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [admin-comments]
      operationId: rejectComment
      summary: Rechaza un comentario.
      description: >-
        El comentario deja de verse y se borra a los 30 días, salvo que se
        apruebe antes. Rechazar uno rechazado no cambia nada.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Comentario rechazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/comments/{id}/replies:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [admin-comments]
      operationId: replyToComment
      summary: Responde a un comentario como autor.
      description: >-
        La respuesta se publica aprobada y marcada como del autor. Solo se
        responde a un comentario aprobado que no es respuesta de otro: hay un
        solo nivel de respuestas.
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorReply"
      responses:
        "201":
          description: Respuesta publicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/admin/comments/{id}/analyze:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [admin-comments]
      operationId: analyzeComment
      summary: Pide de nuevo el análisis de un comentario.
      description: >-
        Vuelve a pedir al clasificador su sugerencia (ADR-022, punto 5) y la
        guarda en `moderation`, reemplazando la anterior. No cambia el estado
        del comentario: el autor sigue decidiendo.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Comentario con el análisis nuevo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ModerationUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Token de acceso JWT, en cookie HttpOnly (ADR-005).
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Token de refresco, en cookie HttpOnly con Path=/api/v1/auth (ADR-005).

  headers:
    SessionCookies:
      description: >-
        Fija o borra las cookies access_token y refresh_token. La respuesta lleva
        una cabecera Set-Cookie por cada cookie.
      schema:
        type: string

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Identificador del post en la URL.
      schema:
        $ref: "#/components/schemas/Slug"
    CommentId:
      name: id
      in: path
      required: true
      description: Identificador del comentario.
      schema:
        type: string
        minLength: 1
        maxLength: 24
    Tag:
      name: tag
      in: query
      required: false
      description: Filtra por etiqueta. Se compara en minúsculas y con los espacios colapsados.
      schema:
        type: string
        minLength: 1
        maxLength: 50
    Limit:
      name: limit
      in: query
      required: false
      description: Tamaño de la página.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Elementos que se saltan antes de la página.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 10000
        default: 0

  responses:
    BadRequest:
      description: La petición no cumple el contrato.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Faltan credenciales o no son válidas.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Las credenciales no dan permiso, o el Origin está fuera de la allowlist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: El slug ya está en uso, o el post ya se publicó alguna vez y su slug no puede cambiar.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: El cuerpo supera el tamaño máximo.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Se superó el límite de peticiones de la IP, o el de logins fallidos del email.
      headers:
        Retry-After:
          description: >-
            Segundos que faltan para el siguiente intento. Se expone a los
            orígenes permitidos con Access-Control-Expose-Headers.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AssistantUnavailable:
      description: >-
        El asistente está desactivado (ASSISTANT_ENABLED=false), el proveedor
        falló o agotó su cuota, o devolvió una sugerencia que no cumple las
        reglas. `detail` dice cuál.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ModerationUnavailable:
      description: >-
        La moderación con LLM está desactivada
        (`detail`: "comment moderation is disabled") o el clasificador falló,
        agotó su tiempo o devolvió una salida inválida
        (`detail`: "comment moderation is unavailable").
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnexpectedError:
      description: Error inesperado.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: Detalle de un error según RFC 9457.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Identifica el tipo de problema.
        title:
          type: string
          description: Resumen legible del tipo de problema.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: Código de estado HTTP.
        detail:
          type: string
          description: Explicación de este caso concreto.
        instance:
          type: string
          format: uri-reference
          description: Identifica este caso concreto.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1

    UserRole:
      type: string
      enum: [admin]

    User:
      type: object
      description: Cuenta de administración, sin datos de credenciales.
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"

    PostStatus:
      type: string
      enum: [draft, published, archived]

    Slug:
      type: string
      minLength: 1
      maxLength: 80
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

    Seo:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 300
        keywords:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        canonicalUrl:
          type: string
          format: uri
          maxLength: 2048
        ogImageUrl:
          type: string
          format: uri
          maxLength: 2048

    PostWrite:
      type: object
      description: >-
        Datos editables de un post. `slug` es opcional: si falta, se genera del
        título al crear y se conserva el actual al editar; solo cambia mientras
        el post es un borrador que nunca se publicó, y si no, responde 409.
        Publicar fija `publishedAt` solo la primera vez.
      required: [title, content, status]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: "#/components/schemas/Slug"
        excerpt:
          type: string
          maxLength: 500
          description: Opcional. Si falta o está vacío, se generan los primeros ~160 caracteres del contenido sin Markdown.
        content:
          type: string
          description: Contenido en Markdown. Se guarda tal cual; la API nunca lo convierte a HTML.
          minLength: 1
        tags:
          type: array
          maxItems: 20
          description: Se guardan en minúsculas, con los espacios colapsados y sin duplicados.
          items:
            type: string
            minLength: 1
            maxLength: 50
        status:
          $ref: "#/components/schemas/PostStatus"
        seo:
          $ref: "#/components/schemas/Seo"

    AssistantDraft:
      type: object
      description: >-
        El borrador que se envía al asistente. Solo el título y el contenido:
        nunca datos de usuarios ni otros posts (ADR-021).
      required: [title, content]
      properties:
        title:
          type: string
          maxLength: 200
          description: Puede estar vacío.
        content:
          type: string
          description: Contenido en Markdown.
          minLength: 1
          maxLength: 50000

    ImprovedWriting:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: >-
            Contenido sugerido en Markdown. Es texto no confiable: se renderiza
            con el mismo sanitizado que cualquier post (packages/markdown).

    MetadataSuggestion:
      type: object
      description: Metadatos sugeridos, con las mismas reglas que en PostWrite.
      required: [title, excerpt, tags]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        excerpt:
          type: string
          minLength: 1
          maxLength: 500
        tags:
          type: array
          maxItems: 20
          description: En minúsculas, con los espacios colapsados y sin duplicados.
          items:
            type: string
            minLength: 1
            maxLength: 50

    PostSummary:
      type: object
      description: Datos de un post para listados, sin su contenido.
      required: [id, authorId, title, slug, tags, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        authorId:
          type: string
        title:
          type: string
        slug:
          $ref: "#/components/schemas/Slug"
        excerpt:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/PostStatus"
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Nulo mientras no se haya publicado.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Post:
      description: Post completo.
      allOf:
        - $ref: "#/components/schemas/PostSummary"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: Contenido en Markdown.
            seo:
              $ref: "#/components/schemas/Seo"

    PostPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostSummary"
        total:
          type: integer
          format: int64
          description: Total de posts que cumplen el filtro.
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32

    CommentStatus:
      type: string
      enum: [pending, approved, rejected]

    CommentSubmission:
      type: object
      description: >-
        Comentario de un lector. Solo texto: la web lo escapa al mostrarlo. No
        se guarda IP, correo ni ningún identificador del lector (ADR-022).
      required: [name, content]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Nombre que se muestra. No se verifica.
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Solo texto, sin Markdown ni HTML.
        parentId:
          type: string
          minLength: 1
          maxLength: 24
          description: >-
            Comentario al que responde. Debe ser un comentario aprobado del
            mismo post que no sea una respuesta.
        website:
          type: string
          maxLength: 200
          description: >-
            Campo trampa: la web lo oculta y una persona lo deja vacío. Si
            llega con valor, el comentario se descarta en silencio con la misma
            respuesta.

    CommentReceipt:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending]
          description: Siempre pending. No revela ningún análisis.

    AuthorReply:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Solo texto, como un comentario.

    PublicComment:
      type: object
      description: Comentario aprobado, sin datos de moderación.
      required: [id, name, content, byAuthor, createdAt]
      properties:
        id:
          type: string
        parentId:
          type: string
          description: Comentario al que responde, si es una respuesta.
        name:
          type: string
        content:
          type: string
          description: Texto no confiable. Se escapa al mostrarlo.
        byAuthor:
          type: boolean
          description: Respuesta del autor del blog.
        createdAt:
          type: string
          format: date-time

    PublicCommentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicComment"
        total:
          type: integer
          format: int64
          description: Total de comentarios aprobados del post.
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32

    ModerationVerdict:
      type: string
      enum: [approve, reject, review]

    ModerationCategory:
      type: string
      enum: [none, spam, abuse, off_topic, prompt_injection, personal_data]

    Moderation:
      type: object
      description: >-
        Sugerencia del clasificador (ADR-022). Solo orienta: el autor decide.
      required: [verdict, category, reason, model, analyzedAt]
      properties:
        verdict:
          $ref: "#/components/schemas/ModerationVerdict"
        category:
          $ref: "#/components/schemas/ModerationCategory"
        reason:
          type: string
        model:
          type: string
        analyzedAt:
          type: string
          format: date-time

    Comment:
      type: object
      description: Comentario completo, para el admin.
      required: [id, postId, name, content, status, byAuthor, createdAt]
      properties:
        id:
          type: string
        postId:
          type: string
        postTitle:
          type: string
          description: >-
            Título actual del post, para la cola de moderación. Falta si el
            post ya no existe.
        postSlug:
          type: string
          description: Slug actual del post. Falta si el post ya no existe.
        parentId:
          type: string
        name:
          type: string
        content:
          type: string
          description: Texto no confiable. Se escapa al mostrarlo.
        status:
          $ref: "#/components/schemas/CommentStatus"
        byAuthor:
          type: boolean
        moderation:
          $ref: "#/components/schemas/Moderation"
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          description: Cuándo el autor lo aprobó o rechazó por última vez.

    CommentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        total:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
